[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-ricer"
version = "0.2.0"
description = "A desktop ricing engine for GNOME: four dials, a different look on every run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "walkingkindle" }]
urls = { Repository = "https://github.com/walkingkindle/instant-ricer" }
keywords = ["gnome", "rice", "theme", "wallpaper", "desktop"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
]
dependencies = ["Pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ricer = "ricer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ricer = ["data/*.tmpl"]

# The manual page. pip puts it under the install prefix (share/man/man1), which is where
# man looks for a command found in the matching bin directory; pipx links it into place too.
[tool.setuptools.data-files]
"share/man/man1" = ["man/ricer.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
